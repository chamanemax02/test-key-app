name: Android CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradlew wrapper is committed to this repo yet, so Gradle itself
      # is installed by the runner (which has internet access, unlike the
      # environment this repo was scaffolded in).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # No secrets are baked into the APK — API_BASE_URL points only at our
      # own backend proxy; the upstream provider's key lives in the
      # backend's environment, never in this repo or the build output.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-lk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Commit the generated wrapper back so local `./gradlew` works too,
      # and future CI runs skip the setup-gradle/generate steps above.
      - name: Commit generated wrapper
        if: github.event_name == 'push'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/
          git diff --staged --quiet || git commit -m "chore: commit generated Gradle wrapper [skip ci]"
          git push
